<!DOCTYPE html>
<html lang="hu">

<head>

	<!-- ===================================================== -->
	<!-- PWA -->
	<!-- ===================================================== -->

	<link rel="manifest" href="manifest.json">

	<meta name="theme-color" content="#2e7d32">

	<meta name="mobile-web-app-capable" content="yes">

	<meta name="apple-mobile-web-app-capable" content="yes">

	<meta name="apple-mobile-web-app-status-bar-style" content="default">

	<meta name="apple-mobile-web-app-title" content="FloraQuiz">

	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

	<meta name="viewport"
		  content="width=device-width,
				   initial-scale=1,
				   viewport-fit=cover">
				   
	<meta charset="UTF-8">

    <title>FloraQuiz</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<script src="js/update.js"></script>

<body>

<div class="container">

    <div class="card">

        <h1>🌿 FloraQuiz</h1>

        <p class="subtitle">
            Ismerd fel Magyarország növényeit!
        </p>

        <div class="menu">

            <button onclick="startQuiz('image')">
                📷 Kép → Latin név
            </button>

            <button onclick="startQuiz('hungarian')">
                🇭🇺 Magyar → Latin
            </button>

            <button onclick="startQuiz('latin')">
                🌿 Latin → Magyar
            </button>

            <button onclick="startQuiz('mixed')">
                🔀 Vegyes
            </button>

        </div>

        <hr>

        <h2>Kategóriák</h2>

        <div class="menu">

            <button onclick="setCategory('trees')">
                🌳 Magyarország fái
            </button>

            <button onclick="setCategory('wildflowers')">
                🌼 Vadvirágok
            </button>

            <button onclick="setCategory('herbs')">
                🌱 Gyógynövények
            </button>

            <button onclick="setCategory('ornamentals')">
                🌵 Dísznövények
            </button>

        </div>

        <hr>

        <div id="scoreBoard">

            ✔ <span id="correctCount">0</span>

            /

            <span id="totalCount">0</span>

        </div>

    </div>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
	if ("serviceWorker" in navigator) {

		window.addEventListener("load", async () => {

			try {

				await navigator.serviceWorker.register("./sw.js");

				console.log("Service Worker regisztrálva.");

			}

			catch (err) {

				console.error(err);

			}

		});

	}
</script>
</body>

</html>
