<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FloraQuiz Editor</title>

    <link rel="stylesheet"
          href="css/editor.css">

</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- Bal oldal -->
    <!-- ========================= -->

    <aside class="sidebar">

        <h1>🌿 FloraQuiz Editor</h1>

        <button id="openProject">
            📂 Projekt megnyitása
        </button>

        <input
            type="text"
            id="search"
            placeholder="🔍 Keresés...">

        <div id="plantList">

        </div>

        <button id="newPlant">
            ➕ Új növény
        </button>

    </aside>

    <!-- ========================= -->
    <!-- Jobb oldal -->
    <!-- ========================= -->

    <main class="editor">

        <h2>Növény adatai</h2>

        <div class="form">

            <label>ID</label>

            <input
                id="id"
                type="number"
                readonly>

            <label>Kategória</label>

            <select id="category">

                <option value="trees">
                    🌳 Magyarország fái
                </option>

                <option value="wildflowers">
                    🌼 Vadvirágok
                </option>

                <option value="herbs">
                    🌱 Gyógynövények
                </option>

                <option value="ornamentals">
                    🌵 Dísznövények
                </option>

            </select>

            <label>Magyar név</label>

            <input
                id="hungarian"
                type="text">

            <label>Latin név</label>

            <input
                id="latin"
                type="text">

            <label>Család</label>

            <input
                id="family"
                type="text">

            <label>Nemzetség</label>

            <input
                id="genus"
                type="text">

        </div>

        <hr>

        <h3>Képek</h3>

        <div id="imageList">

        </div>

        <button id="addImage">

            🖼 Kép hozzáadása

        </button>

        <hr>

        <div class="buttons">

            <button id="savePlant">

                💾 Mentés

            </button>

            <button id="deletePlant">

                🗑 Törlés

            </button>

        </div>

        <div id="status">

            Nincs projekt megnyitva.

        </div>

    </main>

</div>

<script src="js/editor.js"></script>

</body>

</html>
